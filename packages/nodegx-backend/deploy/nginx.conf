# NodeGX self-hosting — the front door (WF-003).
#
# ONE ORIGIN serves both the application and its backend. That is the whole
# design decision, and it buys three things:
#
#   * The app's backend endpoint is the site's own URL. A NodeGX app does not
#     discover its backend at runtime — the editor bakes `metadata.cloudservices`
#     into the bundle at export time — so the fewer distinct URLs involved, the
#     fewer ways that baked value can be wrong.
#   * No CORS, no preflight, no credentialed-request configuration.
#   * The admin dashboard at /_admin is on the same host and port as the app, so
#     one firewall rule and one TLS certificate cover everything. That matters
#     for the school-server case this target is chosen for.
#
# The cost is this file: nginx must know which top-level paths belong to the
# backend. That list is not guesswork — it is the backend's own route table, and
# `tests/deploy-assets.test.ts` starts a real service and fails if any route
# family here is missing. A route added by a later task therefore breaks a test
# with an actionable message rather than 404ing in production.

upstream nodegx_backend {
    server backend:8577;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Uploads go through this proxy to the backend's /files routes. Raise it if
    # your app accepts larger files (and see the backend's own limits).
    client_max_body_size 64m;

    # The app bundle is served from the image, not a bind mount, so a running
    # container is exactly the artifact that was packaged.
    root /srv/app;
    index index.html;

    # nginx's default is to advertise its version on every response and error
    # page. A self-hosted box has no reason to.
    server_tokens off;

    # ---------------------------------------------------------------------
    # Realtime (BAK-001 SSE). Declared FIRST and with `^~` so it wins over the
    # API regex below: an SSE stream through the default proxy settings gets
    # buffered into silence and then killed at 60s, which looks exactly like
    # "realtime doesn't work" and is very hard to diagnose from the app side.
    # ---------------------------------------------------------------------
    location ^~ /realtime {
        proxy_pass http://nodegx_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # ---------------------------------------------------------------------
    # NOT-EXPOSED: /metrics (BAK-009).
    #
    # The Prometheus endpoint is deliberately unreachable from the public
    # origin. It is not secret data — it is counts and durations — but it is an
    # inventory of what this backend does and how busy it is, and there is no
    # reason for the internet to have it. Scrape it from inside instead:
    # `http://backend:8577/metrics` on the compose network, which the backend's
    # own `metrics.allowLoopback`/admin gate governs.
    #
    # `tests/deploy-assets.test.ts` reads this NOT-EXPOSED marker, so this is a
    # declared exemption from the route-family coverage rule rather than a gap.
    location = /metrics {
        access_log off;
        return 404;
    }

    # ---------------------------------------------------------------------
    # The backend's route families. Kept in sync by tests/deploy-assets.test.ts
    # — if that test fails, add the missing segment to BOTH the regex below and
    # the reserved-name list in docs/runtime/SELF-HOSTING.md.
    # ---------------------------------------------------------------------
    location ~ ^/(_admin|admin|aggregate|api|apps|auth|classes|config|executions|files|functions|health|hooks|login|logout|oauth|requestPasswordReset|users|verificationEmailRequest)(/|$) {
        proxy_pass http://nodegx_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Never let a cache sit in front of an authenticated API.
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # ---------------------------------------------------------------------
    # The application.
    # ---------------------------------------------------------------------

    # The entry document changes on every deploy and is tiny. Caching it is how
    # a redeploy "doesn't take" for the one person who complains about it.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Content-hashed bundles (index-<xxhash64>.js and the noodl_bundles) are
    # immutable by construction: a new build gets a new name.
    location ~* ^/(index-[0-9a-f]+\.js|noodl_bundles/.+)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else is the app, with SPA-history fallback so a deep link that
    # the Router owns resolves to the app rather than a 404.
    #
    # No `$uri/` in the try_files list, deliberately: with it, `/` resolves to a
    # directory, autoindex is off, and nginx answers 403 — so a backend-only
    # deploy greeted the operator with "403 Forbidden" instead of the
    # explanation below. Without it, `/` misses as a file and falls through to
    # /index.html, which is what an SPA wants anyway.
    location / {
        try_files $uri /index.html;
    }

    # A deploy with no app bundled (backend + dashboard only) is legitimate —
    # say so instead of serving nginx's stock page.
    error_page 404 = @no_app;
    location @no_app {
        default_type text/plain;
        return 404 "No application bundled in this deploy. The backend API and the admin dashboard at /_admin are still served.\n";
    }
}
