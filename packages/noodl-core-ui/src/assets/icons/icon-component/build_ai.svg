<!-- House glyph. The brand mark's port-and-wire, with the output port replaced by a
     spark: Build is where a wire runs out and something new appears at the end of
     it. The wire terminates exactly on the spark's left point so the two read as
     one gesture rather than two stacked symbols. -->
