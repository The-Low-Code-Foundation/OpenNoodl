<!-- Derived from Lucide (ISC) — see ../LICENSES.md. Lucide's 24-grid geometry is
     kept verbatim; the transform lands it on this set's 16 grid, and stroke-width
     2.4 x 0.625 gives the house 1.5 stroke.

     The GitHub panel's mark. Not the Octocat: Lucide dropped its brand icons, and
     taking one from a second upstream would add a trademark question for one slot.
     This says "the remote side of git" — and paired with git_branch on Version
     control four slots above, the rail now encodes local vs remote rather than
     repeating one shape, which is what it did before. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0.5 0.5) scale(0.625)" stroke-width="2.4"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" x2="6" y1="9" y2="21"/></g></svg>
