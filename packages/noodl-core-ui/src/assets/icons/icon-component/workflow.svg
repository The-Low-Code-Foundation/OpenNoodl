<!-- House glyph. Two steps and the route between them — a workflow is a step DAG,
     so the shape is a node, an elbow, and the next node. Deliberately NOT circles
     and a curve: that reads as git_branch, which sits four slots above it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.6" y="2.4" width="5.6" height="4.2" rx="1.3"/><rect x="8.8" y="9.4" width="5.6" height="4.2" rx="1.3"/><path d="M7.2 4.5h2.6a1.8 1.8 0 0 1 1.8 1.8v3.1"/></svg>
