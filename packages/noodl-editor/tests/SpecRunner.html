<!DOCTYPE HTML>
<html>

<head>
  <meta charset="utf-8">
  <title>Noodl Jasmine Spec Runner</title>

  <link rel="shortcut icon" type="image/png" href="lib/jasmine-3.7.1/jasmine_favicon.png">
  <link rel="stylesheet" type="text/css" href="lib/jasmine-3.7.1/jasmine.css">

  <!-- libs needed for some of the views -->

  <script type="text/javascript">
    var fs = require('fs');
    ['.html', '.css'].forEach(ext => {
      require.extensions[ext] = function (module, filename) {
        module.exports = fs.readFileSync(filename, 'utf8');
      };
    });
    require.extensions['.json'] = function (module, filename) {
      module.exports = JSON.parse(fs.readFileSync(filename, 'utf8'));
    };
  </script>

  <script type="text/javascript" src="lib/jasmine-3.7.1/jasmine.js"></script>
  <script type="text/javascript" src="lib/jasmine-3.7.1/jasmine-html.js"></script>
  <script type="text/javascript" src="lib/jasmine-3.7.1/boot.js"></script>

  <script type="text/javascript">
    jasmine.DEFAULT_TIMEOUT_INTERVAL = 60 * 1000;

    // Jasmine randomizes spec order by default. Parts of this suite share global
    // state (ProjectModel.instance, NodeLibrary registration) and pass or fail
    // depending on the seed, which makes the run useless as a merge gate.
    // Pin the order until those dependencies are untangled — see REV-002 NOTES.
    jasmine.getEnv().configure({ random: false });

    // Report results back to the main process so the run exits with a real status
    // code. Without this the harness is silently green no matter what happens.
    (function () {
      const { ipcRenderer } = require('electron');
      const failures = [];
      let specCount = 0;

      jasmine.getEnv().addReporter({
        specDone: function (result) {
          specCount++;
          if (result.status === 'failed') {
            failures.push({
              fullName: result.fullName,
              messages: (result.failedExpectations || []).map((e) => e.message)
            });
          }
        },
        jasmineDone: function (result) {
          ipcRenderer.send('noodl-test-results', {
            overallStatus: result.overallStatus,
            totalCount: specCount,
            failedCount: failures.length,
            failures
          });
        }
      });
    })();
  </script>

  <script type="text/javascript">
    // In CI the bundle is written to disk by webpack-cli; locally it is served by
    // the webpack dev server on :8081.
    // document.write (not appendChild) so the tag is parser-inserted and `defer`
    // is honoured — specs must be registered before boot.js runs on window load.
    (function () {
      const src = process.env.NOODL_TEST_CI === '1' ? 'index.bundle.js' : 'http://localhost:8081/index.bundle.js';
      document.write(
        '<script defer type="text/javascript" src="' +
          src +
          '" onload="document.querySelector(\'#loader\')?.remove()"' +
          ' onerror="require(\'electron\').ipcRenderer.send(\'noodl-test-fatal\', \'Failed to load ' +
          src +
          '\')"><\/script>'
      );
    })();
  </script>
</head>

<body>
  <div id="loader">Waiting for webpack...</div>
</body>

</html>
