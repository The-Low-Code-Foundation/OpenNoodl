name: PR

# The merge gates. Every job here is a required check on `main` — see
# dev-docs/guidelines/GIT-WORKFLOW.md for the branch-protection policy.
#
# Everything runs on Linux: it is the cheapest runner and the only one whose
# minutes are free on public repos. Platform-specific packaging is covered by
# nightly.yml, not here.

on:
  pull_request:
  push:
    branches: ['main', 'cline-dev']
  workflow_dispatch:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      # The editor's specs are outside its tsconfig so they stay out of the app
      # bundle, which left them unchecked entirely (PLAT-004). They are clean
      # today; this keeps them that way, so a type written in a spec means
      # something.
      - run: npm run typecheck:editor-tests
      # The backend's specs had the same hole, and unlike the editor's they were
      # NOT clean — 32 real reachability/nullability mistakes, fixed in PLAT-004
      # before this line was added. These specs are the closest thing the
      # backend has to a contract test for its HTTP wire, so a type written in
      # one has to mean something.
      - run: npm run typecheck:backend-tests
      # `@nodegx/core` is not in the root program's `include` list and never will be —
      # it is published, so it compiles under `strict` rather than under the root's
      # legacy `noImplicitAny: false` (EXP-001). Its types are the API surface every
      # exported project sees, so they get their own gate.
      - run: npm run typecheck:nodegx-core
      # `noodl-mcp` is not in the root program either, and unlike the others it
      # had no gate at all: the package carried a `typecheck` script no CI job ever
      # called, so its types drifted unobserved and eight errors accumulated there.
      # Its tsconfig covers `src/` AND `tests/` deliberately (see the AAQ-011 note
      # in it) — the specs are how the server's wire contract is stated, so a type
      # written in one has to mean something, the same argument as the two lines above.
      - run: npm run typecheck:mcp
      # ✅ D17 (phase 69). The editor's own program, not the root one.
      #
      # ⚠️ It overlaps `npm run typecheck` above heavily and deliberately: the root
      # program's `include` covers `packages/noodl-editor/src/**/*`, which is a
      # SUPERSET of this config's `src/editor` + `src/shared` + `src/main`. What
      # differs is resolution, not coverage — `packages/noodl-editor/tsconfig.json`
      # maps `@noodl/git` to that package's TypeScript source while the root program
      # resolves it through `node_modules` to built declarations, and it excludes
      # `src/external` (vendored bundles) which the root program does not. So the two
      # can disagree in both directions, and the editor is the surface where a
      # disagreement costs the most.
      #
      # 🔴 It is a gate at ZERO, measured 0 on 2026-08-18 (s24 and s25 independently).
      # `typecheck:runtime` (red at 2) and `typecheck:core-ui` (44) are deliberately
      # NOT here — D17 rules them out until they are burnt down, and adding them now
      # would make this job permanently red and therefore ignored.
      - run: npm run typecheck:editor
      # The bundle budget is a gate, not a report: the companion library's whole
      # proposition is that an exported project carries a small dependency, and a
      # library that grows into a second runtime would quietly retract it.
      - run: npm run size:nodegx-core

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # A ratchet, not a pass/fail gate: the editor sources carry thousands of
      # pre-existing errors, so we only block on *new* ones. See
      # scripts/lint-ratchet.js.
      - run: npm run lint:ci
      # Same shape for the type escape hatches (PLAT-004): TSFixme, bare `any`
      # and the @ts- directives may fall but never rise. All are counted
      # separately, so silencing one by reaching for another does not pass.
      - run: npm run tsfixme
      # Same shape again for hardcoded hex colors in stylesheets (UIX-002):
      # tracked per package (noodl-editor, noodl-core-ui) so a drop in one
      # can never mask a silent rise in the other.
      - run: npm run colors
      # Not a ratchet — a gate at zero (UIX-011). An SVG referenced from CSS via
      # url() renders as its own document and cannot inherit the theme colour,
      # so it silently breaks the light theme. There is no legacy tail left to
      # burn down, so any reintroduction is a straight regression.
      - run: npm run icons:css
      # A gate at zero for the same reason (POL-004). `var(--theme-color-fg-subtle,
      # #7c7c7c)` names nothing, renders its fallback, and is the most reviewable
      # way to ship a hardcoded colour — CSS has no undefined-custom-property
      # error, so nothing anywhere fails. 25 names were in this state when the
      # check was first run, against the 6 a manual pass had found.
      - run: npm run tokens:css

  test-editor:
    name: Test (editor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Electron needs a display even with a hidden window.
      #
      # 🔴 NOODL_TEST_TIMEOUT_MINUTES IS WHY THIS JOB USED TO BE A COIN FLIP. `test.js`
      # caps a run at 15 minutes (`DEFAULT_TIMEOUT_MS`) and the suite needs about 15 minutes, so
      # runner variance alone decided whether it finished. Measured over four runs: one
      # completed (2849 specs, a real summary line) and three were killed mid-suite at 2766,
      # 2264 and 2194 specs with no summary at all — which reads as a FAILING gate rather than
      # an unfinished one, and `exit 1` looks identical either way.
      #
      # ⚠️ Raised because it was measured to be a LIMIT, not a symptom — which is the check
      # `test.js`'s own comment asks for. Per-spec median is 0.001s and FLAT across the whole
      # run, so nothing is degrading; the cost is 59 individually slow specs (17-20s each, all
      # AAQ-*/AIX-*/AIB-*/BEN-001 authoring specs) that eat 12.4 of the 14.9 minutes. Fixing
      # those is the real work and shrinks this back; until then the cap must not be the thing
      # that decides.
      - name: Run editor suite headless
        env:
          NOODL_TEST_TIMEOUT_MINUTES: 30
        run: xvfb-run --auto-servernum -s "-screen 0 1280x1024x24" npm run test:ci

  test-platform:
    name: Test (platform-node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test:platform

  test-packages:
    name: Test (runtime, backend, viewer, mcp, preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # `@noodl/preview`'s suite drives the built CLI over HTTP, not source —
      # `assertPrerequisites()` fails fast, naming these two commands, if either
      # is missing. This job runs independently of the `build` job (no shared
      # filesystem between jobs), so it has to produce its own copies. Found
      # 2026-08-07: this job had never actually reached `@noodl/preview:test`
      # before — Nx bailed the whole run on an earlier package's failure every
      # time — so the gap was invisible until that earlier failure was fixed.
      - name: Build noodl-preview
        run: npm --prefix packages/noodl-preview run build
      - name: Build the deployed viewer runtime
        run: npm run build:editor:_viewer
      # Six jest suites (~1,050 specs) that ran only on developer machines until
      # RUN-004's close-out: the runtime (incl. the local-SQLite persistence
      # integrity test), nodegx-backend, the viewer's SSR/hydration specs, the
      # MCP server, the preview renderer and the cloud runtime. Serial, because
      # several of them bind real sockets.
      - run: npm run test:packages

      # WFA-002: the editor's main-process jest suites (`packages/noodl-editor/
      # tests-main`) were in no workflow — `test:packages` scopes by package and
      # noodl-editor's `test` script starts a dev server, so they ran only on
      # developer machines. They are the gate on execution history, which is
      # exactly the code a run inspector depends on.
      - run: npm run test:main

      # RUN-004's last open criterion: the packaged app runs the backend service
      # under Electron's bundled Node (ELECTRON_RUN_AS_NODE), not the system
      # Node the suites above use. This spawns the real service bundle that way
      # and proves a record survives a full restart — so an Electron upgrade
      # that dropped `node:sqlite` could never reach users as silent data loss.
      - run: npm run check:persistence

  build:
    name: Build (viewer + editor bundles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build viewer bundle
        run: npm run ci:build:viewer
      # Renderer + main webpack bundles only. Packaging (electron-builder) is a
      # nightly concern; it needs per-platform native installs and is far slower.
      - name: Build editor bundles
        run: npm run ci:build:editor

  node-catalog:
    name: Node catalog freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Regenerates the catalog from the live node registries and fails if
      # the committed artifact (packages/noodl-types/src/node-catalog.*)
      # doesn't match — i.e. node definitions changed without regenerating.
      - run: npm run catalog:check
      # SIG-003: every port must declare a `group`. An ungrouped port is not
      # filed under a category anyone chose — `ConnectionBar` renders it under
      # `Other`, so the absence of one line in a node definition reads to a
      # builder as a decision. Also holds the kind headings (Values / Actions /
      # Events) to their kind and refuses the retired names. Runs after
      # catalog:check so a stale catalog fails as staleness, not as a group bug.
      - run: npm run catalog:groups:check
      # Enrichment (SUB-005): every example fragment must validate clean
      # against the semantic validator, and the committed enriched catalog
      # (node-catalog-enriched.*) must match the authored inputs, with every
      # node documented — new nodes cannot ship without an enrichment entry.
      - run: npm run catalog:examples
      - run: npm run catalog:merge:check
      # WFA-001: the same freshness contract for the cloud node library the
      # editor ships (models/nodelibrary/cloud-node-library.json). It is what
      # gives a cloud function's canvas its node types — the cloud runtime has
      # no viewer client to deliver them — so a cloud node added or renamed
      # without regenerating leaves the editor painting it as an unknown type.
      - run: npm run cloud-library:check
      # EXP-008: every catalog node must be classified for code export in
      # packages/nodegx-export/coverage-ledger.json. A new frontend node ships
      # either with a deterministic translation or with an explicit exemption
      # sentence the ledger diff puts in front of review — silent export gaps
      # are the one thing this forbids. Runs after catalog:check so a stale
      # catalog fails as staleness, not as a missing classification.
      - run: npm run export-ledger:check
      # EXP-008, part two: the number the phase is actually judged on. `export-ledger:check`
      # only forces every node to be CLASSIFIED, and a node may ship classified `deferred`
      # with an exemption sentence — which is how the picker drifted to 51 of 127 placeable
      # nodes exporting while the corpus metric read a healthy 85%. This ratchets picker
      # coverage: a fall fails, and a rise fails until the floor is raised in the same commit.
      - run: npm run export-ledger:picker
      # SUB-012: the catalog validator's duplicate-node-id rule, against its
      # committed corrupt/clean fixture pair. A project with two nodes sharing
      # an id used to pass every gate with zero failures.
      - run: node scripts/node-catalog/validate-project.js --self-test

  docs-origin:
    name: Docs origin reachable (LIB-008)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # 🔴 LIB-008. `getDocsEndpoint()` named a GitHub Pages site that stopped
      # existing when `opennoodl-docs` was renamed on 2026-08-07 — Pages, unlike
      # git and the API, does not follow a rename redirect — and it SHIPPED that
      # way in 0.2.3. Every documentation link in the editor was a 404: 176 node
      # pages, the property panel, the node picker, the MCP settings help link.
      # Nothing measured it, so nothing said so.
      #
      # This resolves known pages through the editor's OWN `getDocsEndpoint()`
      # and `getContentEndpoint()` — called, not copied, so a repoint is followed
      # with no edit here — and reports three distinguishable verdicts:
      # ORIGIN GONE (the rename shape), PATH MOVED (the shape a naive repoint
      # leaves: right origin, wrong suffix), and UNAVAILABLE, which exits 2 and
      # is never a pass.
      #
      # ⚠️ BOTH endpoints, deliberately. `getContentEndpoint` is healthy today and
      # was equally healthy right up until a rename; a sweep covering only the one
      # that broke would have learned nothing from what happened.
      #
      # It needs egress by construction, and it is a job of its own for the same
      # reason `lessons` is: a red step hidden behind a green one earlier in the
      # same job has already cost this release three findings.
      - run: npm run docs:verify-origin

  library:
    name: Library check (LIB-001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Every entry under library/{prefabs,modules}/<slug>/: library.json
      # validates against scripts/library/schema.json, the project loads, and
      # the SUB-006 semantic validator reports zero errors. Warnings are
      # reported but not gated — seeded content is LIB-002/003's to repair.
      - run: npm run library:check
      # ✅ CN-016 / D21. `library:check` grades the SOURCES; this grades the
      # ARTEFACT — it builds library-dist/ and walks the editor's own install
      # path against it (fetchModules' URL construction, ModuleCard's field
      # destructuring and URL rule, isModuleCompatible, the JSZip unpack, the
      # SUB-006 project load).
      #
      # 🔴 It is here because it was NOT here, and it rotted in silence.
      # ALPHA-006 §5 split `getContentEndpoint` out of `getDocsEndpoint`
      # (307967a5) and `fetchModules` moved to the new one; verify-dist's stub
      # list did not follow, so every entry failed with "Cannot convert object
      # to primitive value" and nothing reported it. That is exactly the drift
      # between the origin and `library/` that D21 requires a gate for, and the
      # gate's first job is to keep this script honest about itself.
      - run: npm run library:build
      - run: npm run library:verify-dist
      # ✅ CN-016 / D21, the load-bearing half. `library:check` grades the
      # sources and `library:verify-dist` grades the artefact; NEITHER looks at
      # what users actually receive. This fetches the two indexes from the live
      # content origin — via getContentEndpoint() itself, so a repoint is
      # followed with no edit here — and fails when the origin and library/
      # diverge differently than scripts/library/origin-baseline.json records.
      #
      # 🔴 It compares COVERAGE BY LABEL, not content: nothing publishes
      # library/ yet (phase 65 LBR-001), so there is no published payload
      # derived from these sources to hash against, and label is the only field
      # the legacy published names and library/'s slugs share. The script says
      # so in its own output — a gate that implies more than it checks is worse
      # than no gate.
      #
      # ⚠️ It needs egress by construction. An unreachable origin exits 2 as
      # UNAVAILABLE and never as a pass; "could not check" reading as "checked
      # and fine" is the exact silence D21 exists to end.
      - run: npm run library:verify-origin
      # POL-006: the icon set every new project starts with is generated from the
      # library module above, so it goes stale the moment that one is updated —
      # and the only symptom would be a picker quietly showing the old glyph list.
      - run: npm run starter-iconset:check

  lessons:
    name: Lesson bundles (FIX-027)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Every bundle under project-examples/lessons/<slug>/: lesson.json parses
      # and verifies against the node catalog, and BOTH projects — the starter
      # at the bundle root and solution/ — load and validate clean.
      #
      # 🔴 It is a job of its own rather than a step on `library`, on purpose.
      # Three times in this release a red step was hidden behind a green one
      # earlier in the same job (nx bailing across packages, a failing assertion
      # hiding the next, a passing step-3 hiding a red step-4). A lesson bundle
      # is learner-facing content and should not be able to go unreported
      # because an unrelated check ahead of it failed first.
      #
      # ⚠️ Warnings fail this gate, unlike `library:check`. An unknown node type
      # arrives as a WARNING, and that is precisely how the sibling gate came to
      # report 58/58 clean while nine shipped prefabs had no type at all. The
      # script's header explains why the strict bar is affordable here.
      - run: npm run lessons:check
      # The gate's own mutation grading: it copies the real bundle, breaks it
      # seven ways and requires every break to be caught. A content gate over a
      # corpus of one reports "clean" whether or not it is looking, so the
      # measurement above is only worth its exit code if this passes too.
      - run: npm run lessons:check:self-test
      # SYL-002 — the JOIN between lessons, which the two steps above cannot see.
      # `derive_starter` guarantees a starter matches its OWN solution; nothing
      # guaranteed it matches the PREVIOUS LESSON'S. Both failures look identical
      # from inside one bundle, so a green corpus was never evidence for the chain.
      #
      # ⚠️ The cross-check against the community repo's curriculum.json does NOT
      # run here — that checkout does not exist on this runner — and the script
      # says so in its output rather than reporting silence as agreement. The
      # chain itself IS checked here, from spine.json beside the bundles.
      - run: npm run lessons:chain
      # 🔴 Same reason as the self-test above, and more sharply: this gate's first
      # run over a healthy corpus finds nothing, which is indistinguishable from a
      # gate that is not looking. Twelve mutations, including three INVERTED arms —
      # a canvas move must not fail, an unbuilt lesson must skip rather than pass,
      # and the no-curriculum shape (this runner's) must still check the chain.
      - run: npm run lessons:chain:self-test

  artefacts:
    name: Check build artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No install: the check only shells out to `git ls-files`.
      - run: node scripts/check-build-artefacts.js
      # The release-completeness rules only run on a tag, where there is a draft
      # to read — so their own logic would otherwise be exercised for the first
      # time during a release. The self-test runs them against fixtures,
      # including the measured v0.1.0 asset list, on every PR.
      - run: node scripts/check-release-assets.js --self-test
